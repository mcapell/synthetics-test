name: release

on:
  workflow_dispatch:
    inputs:
      is-stack-release:
        type: boolean
        description: Should we tag the current version as a stack release?
        required: true
        default: false
      dry-run:
        type: boolean
        description: "Should we run in dry-run mode?"
        required: true
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for semantic-release to push the tag
      id-token: write # required for OIDC and provenance (npm publish)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - run: npm ci # runs npm prepublish

      - run: npx semantic-release --dry-run="${DRY_RUN}"
        env:
          DRY_RUN: ${{ github.event.inputs.dry-run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version and package name
        run: |
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          echo "NPM_PACKAGE=$(jq -r '.name' package.json)" >> $GITHUB_ENV

      - name: Exchange OIDC token for npm auth token
        id: exchange
        shell: bash
        env:
          PACKAGE_NAME: "@mcapell/synthetics-test"
          RUNNER_DEBUG: ${{ runner.debug }}
        run: |
          set -euo pipefail

          # Safely encode the package name
          ENCODED_PACKAGE=$(printf "%s" "$PACKAGE_NAME" | jq -Rr @uri)

          if [[ "$RUNNER_DEBUG" == "1" ]]; then
            echo "Encoded package name: $ENCODED_PACKAGE"
          fi

          # Request GitHub OIDC token with npm audience
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty')

          if [[ -z "$OIDC_TOKEN" ]]; then
            echo "::error::Failed to get OIDC token from GitHub"
            exit 1
          fi

          # Exchange OIDC token for npm auth token
          SCOPE_PAYLOAD='{"scope": ["write:dist-tags"]}'
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "$SCOPE_PAYLOAD" \
            -w "\n%{http_code}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ENCODED_PACKAGE")

          # Extract status code and body
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [[ "$HTTP_CODE" != "201" ]]; then
            echo "::error::Failed to exchange token. Status: $HTTP_CODE"
            echo "::error::Response Body: $BODY"
            exit 1
          fi

          # Extract and mask the npm token
          NPM_TOKEN=$(echo "$BODY" | jq -r '.token // empty')

          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::error::No token in response"
            echo "::error::Response Body: $BODY"
            exit 1
          fi

          echo "::add-mask::$NPM_TOKEN"
          echo "token=$NPM_TOKEN" >> $GITHUB_OUTPUT
          echo "NPM_TOKEN=$NPM_TOKEN" >> $GITHUB_ENV

      - name: Create 'stack_release' dist-tag
        if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.is-stack-release == 'true' }}
        run: npm dist-tag add "${NPM_PACKAGE}@${VERSION}" stack_release
